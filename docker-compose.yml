services:
  postgres:
    image: postgres:16-alpine
    container_name: hostel-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostel
      POSTGRES_PASSWORD: hostel
      POSTGRES_DB: hostel_saas
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostel -d hostel_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
